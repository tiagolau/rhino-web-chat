# Rhino Webchat — stack Docker Swarm na VPS Mapeamento, atrás do Traefik existente.
#
#   docker build -t rhino-webchat:latest /root/apps/webchat
#   set -a; . /root/stacks/webchat.env; set +a
#   docker stack deploy -c /root/stacks/webchat.yaml webchat
#
# Espera da VPS: rede overlay externa `Mapeamento` e certresolver `letsencryptresolver`.

services:
  app:
    image: ${WEBCHAT_IMAGE:-rhino-webchat:latest}
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:?defina PUBLIC_URL}
      DATABASE_URL: postgres://webchat:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/webchat
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      CPF_PEPPER: ${CPF_PEPPER:?defina CPF_PEPPER}
      CPF_ENC_KEY: ${CPF_ENC_KEY:?defina CPF_ENC_KEY}
      DATACRAZY_API_BASE: ${DATACRAZY_API_BASE:-https://api.g1.datacrazy.io}
      DATACRAZY_API_TOKEN: ${DATACRAZY_API_TOKEN:?defina DATACRAZY_API_TOKEN}
      DATACRAZY_UPLOAD_BASE: ${DATACRAZY_UPLOAD_BASE:-https://crm.g1.datacrazy.io}
      DATACRAZY_CDN_BASE: ${DATACRAZY_CDN_BASE:-https://g1cdn1.datacrazy.io}
      ANEXOS_NO_CRM: ${ANEXOS_NO_CRM:-false}
      DC_REST_PER_MINUTE: ${DC_REST_PER_MINUTE:-10}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      FILES_DIR: /data/files
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      DEVICE_CPF_LIMIT: ${DEVICE_CPF_LIMIT:-3}
      IP_CPF_LIMIT_PER_HOUR: ${IP_CPF_LIMIT_PER_HOUR:-30}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?defina ADMIN_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Anexos aguardando transferência/verificação no CRM; precisa de backup.
      - webchat_files:/data/files
    networks:
      - interna
      - publica
    deploy:
      # 2 réplicas para disponibilidade. Elas compartilham o volume (nó único) e
      # se coordenam pelo Postgres (fila SKIP LOCKED e LISTEN/NOTIFY).
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
        reservations:
          memory: 128M
      placement:
        constraints:
          - node.role == manager
      labels:
        traefik.enable: "true"
        traefik.swarm.network: Mapeamento
        traefik.http.routers.webchat.rule: Host(`webchat.engrenatec.com.br`)
        traefik.http.routers.webchat.entrypoints: websecure
        traefik.http.routers.webchat.tls.certresolver: letsencryptresolver
        traefik.http.services.webchat.loadbalancer.server.port: "3000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webchat
      POSTGRES_USER: webchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - webchat_pg:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webchat -d webchat"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      # dnsrr: o app conecta direto no container, sem o VIP/IPVS do Swarm, que
      # derruba em silêncio conexões ociosas (matou o LISTEN/NOTIFY em produção).
      endpoint_mode: dnsrr
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M
      placement:
        constraints:
          - node.role == manager

volumes:
  webchat_files:
  webchat_pg:

networks:
  interna:
    driver: overlay
  publica:
    external: true
    name: Mapeamento
